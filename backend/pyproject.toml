[project]
name = "creatoros-backend"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "SQLAlchemy",
    "psycopg2-binary",
    "python-dotenv",
    "google-api-python-client",
    "PyJWT",
    "requests",
    "werkzeug"
]

[tool.vercel]
entrypoint = "run:app"